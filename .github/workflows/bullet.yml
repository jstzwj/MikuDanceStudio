name: Bullet build regressions

on:
  pull_request:
    paths:
      - '.github/workflows/bullet.yml'
      - 'recipes/bullet275/**'
      - 'src/math/mmd_compat/**'
      - 'include/mikudancestudio/mmd_math.hpp'
      - 'profiles/**'
      - 'conanfile.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/mmd_math*'
      - 'tests/bullet_allocation_test.cpp'
      - 'tests/bullet_simulation_test.cpp'
      - 'tests/physics_tolerance*'
      - 'tests/physics_trajectory_test.cpp'
  push:
    paths:
      - '.github/workflows/bullet.yml'
      - 'recipes/bullet275/**'
      - 'src/math/mmd_compat/**'
      - 'include/mikudancestudio/mmd_math.hpp'
      - 'profiles/**'
      - 'conanfile.py'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'tests/mmd_math*'
      - 'tests/bullet_allocation_test.cpp'
      - 'tests/bullet_simulation_test.cpp'
      - 'tests/physics_tolerance*'
      - 'tests/physics_trajectory_test.cpp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bullet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
        configuration: [Debug, Release]
        cmake: ['3.21.4', '4.0.3']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install conan==2.27.1 cmake==${{ matrix.cmake }}
      - name: Build and install vendored Bullet
        run: |
          conan profile detect --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan create recipes/bullet275 --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=${{ matrix.configuration }} --build=missing --lockfile=""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan install . --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=${{ matrix.configuration }} --build=missing --lockfile="" --output-folder=out/bullet
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure regression tests
        run: |
          $platform = if ('${{ matrix.arch }}' -eq 'x86') { 'Win32' } else { 'x64' }
          cmake -S . -B out/bullet/build -G "Visual Studio 17 2022" -A $platform -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/out/bullet/build/generators/conan_toolchain.cmake" -DBUILD_TESTING=ON -DMIKUDANCESTUDIO_DIAG=OFF
      - name: Build regression tests
        run: |
          $targets = @('bullet_allocation_test', 'bullet_simulation_test', 'physics_tolerance_test')
          if ('${{ matrix.arch }}' -eq 'x86') { $targets += 'mmd_math_test' }
          cmake --build out/bullet/build --config ${{ matrix.configuration }} --target $targets --parallel 4
      - name: Check upstream sources, simulation, allocation and application math
        run: >-
          ctest --test-dir out/bullet/build -C ${{ matrix.configuration }}
          -R "^(bullet_allocation|bullet_simulation|bullet_upstream_sources|mmd_math|physics_tolerance)$" --output-on-failure
          --timeout 90 --no-tests=error
          --output-junit "$env:GITHUB_WORKSPACE/out/bullet/build/bullet-tests.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bullet-${{ matrix.arch }}-${{ matrix.configuration }}-cmake-${{ matrix.cmake }}
          path: |
            out/bullet/build/bullet-tests.xml
            out/bullet/build/Testing/Temporary/*.log
          if-no-files-found: warn
