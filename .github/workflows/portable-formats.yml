name: Portable formats

on:
  push:
    branches: [next, 'validation/rhi-resources-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            generator: Unix Makefiles
          - os: macos-15
            arch: arm64
            generator: Unix Makefiles
          - os: windows-2022
            arch: x64
            generator: Visual Studio 17 2022
          - os: windows-2022
            arch: Win32
            generator: Visual Studio 17 2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: KhronosGroup/Vulkan-Headers
          ref: v1.3.296
          path: out/vulkan-headers
      - name: Install Linux probe runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Fetch pinned macOS probe runtime
        if: runner.os == 'macOS'
        run: python tools/fetch_moltenvk_probe.py --output out/moltenvk
      - name: Build and repeat foundation tests (Linux)
        if: runner.os == 'Linux'
        run: >-
          python tools/run_portable_baseline.py --build-dir out/p0
          --generator '${{ matrix.generator }}' --vulkan-include out/vulkan-headers/include
          --require-device
      - name: Build and repeat foundation tests (macOS hardware)
        if: runner.os == 'macOS'
        run: >-
          python tools/run_portable_baseline.py --build-dir out/p0
          --generator '${{ matrix.generator }}' --vulkan-include out/vulkan-headers/include
          --vulkan-library out/moltenvk/libMoltenVK.dylib --require-hardware
      - name: Build and repeat foundation tests (Windows)
        if: runner.os == 'Windows'
        run: >-
          python tools/run_portable_baseline.py --build-dir out/p0
          --generator '${{ matrix.generator }}' --architecture '${{ matrix.arch }}'
          --vulkan-include out/vulkan-headers/include --probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            out/p0/evidence/
            out/p0/environment-*.json
            out/p0/baseline/
            out/p0/resources/portable/p1/
            out/p0/resources/portable/p1-dependencies.json
            out/p0/resources/portable/generated/model_runtime_targets.json
          if-no-files-found: error
