name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v10.00)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG"
      - name: Install Conan
        run: python -m pip install conan==2.27.1
      - name: Build vendored Bullet and configure dependencies
        run: |
          conan profile detect --force
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan create recipes/bullet275 --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile=""
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          conan install . --profile:all profiles/${{ matrix.arch }} -s compiler.cppstd=17 -s build_type=Release --build=missing --lockfile="" --output-folder=out/ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Configure Release
        run: >-
          cmake -S . -B out/ci/build -G "Visual Studio 17 2022" -A ${{ matrix.platform }}
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/out/ci/build/generators/conan_toolchain.cmake"
          -DBUILD_TESTING=OFF -DMIKUDANCESTUDIO_DIAG=OFF
      - name: Build Release
        run: cmake --build out/ci/build --config Release --parallel 4
      - name: Package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py --tag "$env:RELEASE_TAG" --build-dir out/ci/build --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: out/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Publish both architectures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" assets/* --clobber
          else
            gh release create "$RELEASE_TAG" assets/* --verify-tag --title "MikuDanceStudio $RELEASE_TAG" --generate-notes
          fi
